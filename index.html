<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elecciones 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #d1d5db;
            background: radial-gradient(circle at 30% 30%, #2c2c2e, #1c1c1e 70%, #0a0a0a 100%);
            position: relative;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            color: #e3e8ef;
            text-shadow: 0 0 15px #b0c4de, 0 0 25px #9fb6cd;
        }

        p {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            margin: 0.8rem;
            padding: 0.9rem 2.3rem;
            border-radius: 0.5rem;
            border: 1px solid #b0c4de;
            color: #e0e7ef;
            background: linear-gradient(145deg, #6f7a88, #2e3238);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            box-shadow: inset 0 0 5px #a0a9b4, 0 0 12px rgba(180, 190, 200, 0.3);
        }

        .btn:hover {
            background: linear-gradient(145deg, #d8e2eb, #5a6775);
            color: #0a0a0a;
            box-shadow: 0 0 25px rgba(180, 190, 200, 0.8);
            transform: translateY(-2px);
        }

        footer {
            position: absolute;
            bottom: 1rem;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #7c8590;
        }

        body.fade-out {
            opacity: 0;
            transform: scale(1.02) translateY(-10px);
        }

        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Fondo dinámico -->
    <canvas id="metal-bg"></canvas>

    <main>
        <h1>Monitoreo de Eleccions Subnacionales</h1>        
        <div>
            <a href="./municipales.html?codigo_municipio=70101&tipo_eleccion=MUNICIPALES&tipo_encuesta=PRIMERA" class="btn" onclick="transitionToPage(event)">Municipales 2025</a>
            <a href="./departamentales.html" class="btn" onclick="transitionToPage(event)">Departamentales 2025</a>
        </div>
    </main>

    <footer>© 2025 SIGA - LopezService</footer>

   <script>

    
  // Transición tipo PowerPoint
  function transitionToPage(event) {
    event.preventDefault();
    const targetUrl = event.currentTarget.getAttribute('href');
    document.body.classList.add('fade-out');
    setTimeout(() => window.location.href = targetUrl, 500);
  }

  // Fondo metálico animado con curvas aleatorias por toda la pantalla
  const canvas = document.getElementById("metal-bg");
  const ctx = canvas.getContext("2d");
  let width, height, waves;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = canvas.width = window.innerWidth * dpr;
    height = canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
    createWaves();
  }

  function createWaves() {
    waves = [];
    const totalWaves = 20; // más ondas, más relleno visual
    for (let i = 0; i < totalWaves; i++) {
      waves.push({
        amplitude: Math.random() * 80 + 30,          // altura de cada onda
        wavelength: Math.random() * 250 + 120,       // longitud de onda
        speed: Math.random() * 0.002 + 0.001,
        offset: Math.random() * Math.PI * 2,
        verticalShift: Math.random() * height,       // posición vertical aleatoria
        color: `rgba(${150 + Math.random()*80}, ${150 + Math.random()*80}, ${150 + Math.random()*80}, ${0.15 + Math.random()*0.15})`
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, width, height);
    ctx.lineWidth = 1.8;

    waves.forEach(w => {
      ctx.beginPath();
      for (let x = 0; x <= width; x += 8) {
        const y =
          w.verticalShift +
          Math.sin((x / w.wavelength) + (t * w.speed) + w.offset) * w.amplitude +
          Math.cos((x / 100) + t * 0.001) * 10;
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = w.color;
      ctx.stroke();
    });

    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(draw);
</script>

</body>

</html>
